<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">

<title>Legacy Shaper · Collection Office</title>
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Hanken+Grotesk:wght@300;400;500;600&display=swap">
<style>
:root{--deep:#1B3924;--green:#244A30;--ink:#16241A;--gold:#C4A052;--goldtxt:#7A6332;--soft:#E9DDBE;--ivory:#F4F0E6;--paper:#FBF8F1;--line:rgba(36,74,48,.16);--muted:#5d6b60}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ivory);color:var(--ink);font:400 16px/1.55 "Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px))}
.top{display:flex;justify-content:flex-end;min-height:28px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{all:unset;cursor:pointer;padding:5px 12px;font:500 11px/1 "Hanken Grotesk",sans-serif;letter-spacing:2px;color:var(--muted)}
.lang button.on{background:var(--green);color:var(--ivory)}
.hero{text-align:center;padding:6px 0 26px}
.logo{display:block;margin:0 auto 22px;width:150px;height:auto}
.kick{font:500 11px/1 "Hanken Grotesk",sans-serif;letter-spacing:4px;text-transform:uppercase;color:var(--goldtxt)}
h1{font:500 clamp(34px,7vw,46px)/1.08 "Cormorant Garamond",Georgia,serif;color:var(--green);margin:12px 0 18px}
.rule{width:56px;height:1px;background:var(--gold);margin:0 auto 18px}
.lead{font:400 clamp(19px,3.6vw,21px)/1.5 "Cormorant Garamond",Georgia,serif;color:var(--ink);max-width:600px;margin:0 auto 12px}
.how{font-size:14px;color:var(--muted);max-width:560px;margin:0 auto}
section{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px 18px 8px;margin:18px 0}
h2{font:500 26px/1.15 "Cormorant Garamond",Georgia,serif;color:var(--green);margin:0 0 4px}
h2 small{display:block;font:500 11px/1 "Hanken Grotesk",sans-serif;letter-spacing:3px;text-transform:uppercase;color:var(--goldtxt);margin-bottom:8px}
.sub{font-size:14px;color:var(--muted);margin:2px 0 8px}
.q{padding:16px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.ql{font-weight:500;margin:0 0 10px}
.ql .opt{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{appearance:none;-webkit-appearance:none;cursor:pointer;border:1px solid rgba(36,74,48,.28);background:#fff;color:var(--ink);border-radius:999px;padding:9px 15px;font:400 15px/1.2 "Hanken Grotesk",sans-serif;min-height:40px;transition:background .15s,color .15s,border-color .15s;touch-action:manipulation}
.pill:hover{border-color:var(--green)}
.pill[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--ivory)}
.pill:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media (max-width:560px){.row2,.row3{grid-template-columns:1fr}}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
input.t{width:100%;border:1px solid rgba(36,74,48,.28);background:#fff;border-radius:10px;padding:11px 12px;font:400 16px/1.2 "Hanken Grotesk",sans-serif;color:var(--ink)}
input.t:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--green)}
.sub2{margin-top:12px}
.item{padding:14px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .ql{font-weight:400;margin-bottom:9px}
.item .pill{padding:7px 12px;font-size:14px;min-height:36px}
.send{text-align:center;margin:28px 0 10px}
.btn{appearance:none;-webkit-appearance:none;cursor:pointer;border:0;border-radius:999px;background:var(--deep);color:var(--ivory);padding:15px 30px;font:500 13px/1 "Hanken Grotesk",sans-serif;letter-spacing:3px;text-transform:uppercase;min-height:48px}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--green);border:1px solid var(--green)}
.note{font-size:14px;color:var(--muted);margin:12px auto 0;max-width:560px;text-align:center}
.note.warn{color:var(--goldtxt)}
.remind{display:none;background:var(--soft);border-radius:12px;padding:14px 16px;margin:16px 0;font-size:14px}
.remind.on{display:block}
.remind b{font-weight:600}
.remind .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;justify-content:center}
.thanks,.closed{text-align:center;padding:30px 4px 10px}
.thanks p,.closed p{font:400 21px/1.5 "Cormorant Garamond",Georgia,serif;max-width:540px;margin:0 auto 14px}
.foot{text-align:center;font:500 10px/1.6 "Hanken Grotesk",sans-serif;letter-spacing:3px;text-transform:uppercase;color:var(--goldtxt);margin-top:30px}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

},
en: {

  docs: "Your documents are mostly", docsPlaceO: ["Kept in one place", "Spread across several places or people"], docsFormO: ["Digital", "Paper", "Both"],

const K = {
  works: ["lt50", "50to100", "100to250", "gt250"], yn: ["yes", "no"], own: ["one", "several"],
  inventory: ["none", "list", "sheet", "software"], assistant: ["yes", "no"],
  origin: ["galleries", "auctions", "private", "inheritance"], nature: ["paintings", "paper", "sculpture", "editions", "photo", "objects"],
  levels: ["all", "most", "some", "rarely", "unknown"],
  items: ["basics", "photos", "invoices", "provenance", "certificates", "condition", "values", "insured", "location", "customs", "framing", "loans"],
  docsPlace: ["one", "several"], docsForm: ["digital", "paper", "both"]
};

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const token = (new URLSearchParams(location.search).get("k") || "").toLowerCase();
// Journal des ouvertures (014): the page tells only the type of device. Dylan's own checks (link opened from
// The Legacy with « Voir la page », i.e. &apercu=1) are kept apart, and this browser is remembered as his.
const SELF = (() => { try {
  const u = new URL(location.href);
  if (u.searchParams.get("apercu") === "1") { localStorage.setItem("ls-self", "1"); u.searchParams.delete("apercu"); history.replaceState(null, "", u.pathname + u.search + u.hash); return true; }
  return localStorage.getItem("ls-self") === "1"; } catch (e) { return false; } })();
const DEVICE = (() => { const ua = navigator.userAgent || "";
  if (/iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return "iPad";
  if (/iPhone|iPod/.test(ua)) return "iPhone"; if (/Android/.test(ua)) return "Android";
  if (/Macintosh/.test(ua)) return "Mac"; if (/Windows/.test(ua)) return "Windows"; return "Ordinateur"; })();
const DRAFT = "ls-scoping-" + token;
let lang = "fr", A = { items: {} }, status = "loading";
const store = { get() { try { return JSON.parse(localStorage.getItem(DRAFT) || "null"); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem(DRAFT, JSON.stringify(v)); } catch (e) {} }, del() { try { localStorage.removeItem(DRAFT); } catch (e) {} } };

function pills(field, keys, labels, multi, sub) {
  const cur = sub ? (A.items || {})[field] : A[field];
  return `<div class="pills" role="group">${keys.map((k, i) => {
    const on = multi ? Array.isArray(cur) && cur.includes(k) : cur === k;
    return `<button type="button" class="pill" aria-pressed="${on}" data-f="${field}" data-k="${k}"${multi ? " data-multi" : ""}${sub ? " data-sub" : ""}>${esc(labels[i])}</button>`; }).join("")}</div>`;
}
const txt = (id, label, opt, type) => `<div><label class="f" for="${id}">${esc(label)}${opt ? ` <span class="opt">(${esc(T[lang].optional)})</span>` : ""}</label>
  <input class="t" id="${id}" data-tf="${id}" ${type === "num" ? 'inputmode="numeric"' : ""} ${id === "firstName" ? 'autocomplete="given-name"' : id === "lastName" ? 'autocomplete="family-name"' : id === "company" ? 'autocomplete="organization"' : ""} value="${esc(A[id] || "")}"></div>`;

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t[el.dataset.t] || ""; });
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.lang === lang));
  if (status === "closed" || status === "already") $("#closedMsg").textContent = status === "already" ? t.already : status === "offline" ? t.offline : t.invalid;
  if (status === "offline") $("#closedMsg").textContent = t.offline;
  // once sent: a short, reassuring page (Dylan, 12 Oct 2026) — the introduction gives way to « Merci »
  const done = status === "sent" || status === "already";
  if (done) $("h1").textContent = t.thanksTitle;
  document.querySelectorAll(".hero .lead, .hero .how").forEach(el => el.classList.toggle("hidden", done));
  if (status !== "open") return;
  $("#form").innerHTML = `
  <section>
    <h2>${esc(t.s1)}</h2>
    <div class="q"><p class="ql">${esc(t.works)}</p>${pills("works", K.works, t.worksO)}<div class="sub2" style="max-width:280px">${txt("worksExact", t.worksExact, true, "num")}</div></div>
    <div class="q"><p class="ql">${esc(t.placesQ)}</p><div class="row2">${txt("places", t.places, false, "num")}${txt("countries", t.countries, false, "num")}</div></div>
    <div class="q"><p class="ql">${esc(t.insQ)}</p><div class="row2">${txt("policies", t.policies, false, "num")}<div><label class="f">${esc(t.broker)}</label>${pills("broker", K.yn, [t.yes, t.no])}</div></div></div>
    <div class="q"><p class="ql">${esc(t.ownQ)}</p>${pills("ownership", K.own, t.ownO)}<div class="sub2"><label class="f">${esc(t.coowned)}</label>${pills("coowned", K.yn, [t.yes, t.no])}</div></div>
    <div class="q"><p class="ql">${esc(t.inventory)}</p>${pills("inventory", K.inventory, t.inventoryO)}</div>
    <div class="q"><p class="ql">${esc(t.assistant)}</p>${pills("assistant", K.assistant, t.assistantO)}</div>
    <div class="q"><p class="ql">${esc(t.origin)}<span class="opt">${esc(t.multi)}</span></p>${pills("origin", K.origin, t.originO, true)}</div>
    <div class="q"><p class="ql">${esc(t.nature)}<span class="opt">${esc(t.multi)}</span></p>${pills("nature", K.nature, t.natureO, true)}</div>
  </section>
  <section>
    <h2>${esc(t.s2)}</h2><p class="sub">${esc(t.s2lead)}</p>
    ${K.items.map((k, i) => `<div class="item" id="it_${k}"><p class="ql">${esc(t.items[i])}</p>${pills(k, K.levels, t.levels, false, true)}</div>`).join("")}
    <div class="q" style="border-top:1px solid var(--line)"><p class="ql">${esc(t.docs)}</p>${pills("docsPlace", K.docsPlace, t.docsPlaceO)}<div class="sub2">${pills("docsForm", K.docsForm, t.docsFormO)}</div></div>
  </section>
  <section>
    <h2>${esc(t.s3)}</h2>
    <div class="q"><div class="row3">${txt("firstName", t.firstName)}${txt("lastName", t.lastName)}<div><label class="f" for="date">${esc(t.date)}</label><input class="t" id="date" data-tf="date" value="${esc(A.date || "")}"></div></div>
      <div class="row2 sub2">${txt("company", t.company, true)}${txt("collection", t.collection, true)}</div></div>
  </section>
  <p class="lead" style="text-align:center;margin:26px auto 0">${esc(t.closing)}</p>
  <div id="remind" class="remind" role="status"></div>
  <div class="send"><button type="submit" class="btn" id="sendBtn">${esc(t.send)}</button></div>
  <p class="note" id="msg">${esc(t.saved)}</p>`;
}

function unanswered() {
  const t = T[lang], miss = [];
  if (!A.works && !A.worksExact) miss.push(t.works);
  if (!A.places) miss.push(t.places);
  if (!A.policies) miss.push(t.policies);
  if (!A.ownership) miss.push(t.ownQ);
  if (!A.inventory) miss.push(t.inventory);
  if (!A.assistant) miss.push(t.assistant);
  K.items.forEach((k, i) => { if (!(A.items || {})[k]) miss.push(t.items[i]); });
  if (!A.docsPlace || !A.docsForm) miss.push(t.docs);
  return miss;
}

async function rpc(name, body) {
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${name}`, { method: "POST", headers: { "apikey": SB_KEY, "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error("http " + r.status);
  return r.json();
}

async function send(btn) {
  const t = T[lang], m = $("#msg");
  btn.disabled = true; btn.textContent = t.sending;
  const answers = Object.assign({}, A, { lang, sentAt: new Date().toISOString(), device: /iPhone|iPad/.test(navigator.userAgent) ? "iOS" : /Android/.test(navigator.userAgent) ? "Android" : /Macintosh/.test(navigator.userAgent) ? "Mac" : "Ordinateur" });
  try {
    const r = await rpc("scoping_submit", { p_token: token, p_answers: answers });
    if (r && r.ok) {
      store.del(); status = "sent";
      try { fetch(`${SB_URL}/functions/v1/scoping-notify`, { method: "POST", keepalive: true, headers: { "apikey": SB_KEY, "Content-Type": "application/json" }, body: JSON.stringify({ token }) }).catch(() => {}); } catch (e) {}
      $("#form").classList.add("hidden"); $("#thanks").classList.remove("hidden"); render(); window.scrollTo({ top: 0, behavior: "smooth" }); return;
    }
    if (r && r.reason === "already") { store.del(); status = "already"; $("#form").classList.add("hidden"); $("#closed").classList.remove("hidden"); render(); window.scrollTo({ top: 0 }); return; }
    if (r && r.reason === "link") { status = "closed"; $("#form").classList.add("hidden"); $("#closed").classList.remove("hidden"); render(); window.scrollTo({ top: 0 }); return; }
    throw new Error("refused");
  } catch (e) {
    btn.disabled = false; btn.textContent = t.send; m.textContent = t.sendFail; m.classList.add("warn");
  }
}

function wire() {
  const f = $("#form");
  f.addEventListener("click", e => {
    const p = e.target.closest(".pill"); if (p) {
      const { f: field, k } = p.dataset;
      if (p.hasAttribute("data-sub")) { A.items = A.items || {}; if (A.items[field] === k) delete A.items[field]; else A.items[field] = k; }
      else if (p.hasAttribute("data-multi")) { const a = Array.isArray(A[field]) ? A[field] : []; A[field] = a.includes(k) ? a.filter(x => x !== k) : a.concat(k); if (!A[field].length) delete A[field]; }
      else { if (A[field] === k) delete A[field]; else A[field] = k; }   // a second tap clears the answer
      p.parentNode.querySelectorAll(".pill").forEach(b => {
        const on = p.hasAttribute("data-sub") ? A.items[field] === b.dataset.k : p.hasAttribute("data-multi") ? (A[field] || []).includes(b.dataset.k) : A[field] === b.dataset.k;
        b.setAttribute("aria-pressed", String(on)); });
      store.set(A); return; }
    const r = e.target.closest("[data-remind]"); if (r) {
      const box = $("#remind");
      if (r.dataset.remind === "complete") { box.classList.remove("on"); const first = K.items.find(k => !(A.items || {})[k]); const el = first ? $("#it_" + first) : f; el.scrollIntoView({ behavior: "smooth", block: "center" }); }
      else { box.classList.remove("on"); send($("#sendBtn")); }
    }
  });
  f.addEventListener("input", e => { const id = e.target.dataset.tf; if (!id) return; const v = e.target.value.trim(); if (v) A[id] = e.target.value.slice(0, 300); else delete A[id]; store.set(A); });
  f.addEventListener("submit", e => {
    e.preventDefault(); const t = T[lang], m = $("#msg"), btn = $("#sendBtn");
    if (!(A.firstName || "").trim() || !(A.lastName || "").trim()) { m.textContent = t.needName; m.classList.add("warn"); $(!(A.firstName || "").trim() ? "#firstName" : "#lastName").focus(); return; }
    const miss = unanswered(), box = $("#remind");
    if (miss.length && !box.classList.contains("on")) {
      box.innerHTML = `<b>${esc(t.remind)}</b> ${esc(miss.slice(0, 6).join(" · "))}${miss.length > 6 ? " …" : ""}<br>${esc(t.remindEnd)}
        <div class="acts"><button type="button" class="btn ghost" data-remind="complete">${esc(t.complete)}</button><button type="button" class="btn" data-remind="send">${esc(t.sendAnyway)}</button></div>`;
      box.classList.add("on"); box.scrollIntoView({ behavior: "smooth", block: "center" }); return; }
    box.classList.remove("on"); send(btn);
  });
}

document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang; if (status === "open") { const y = window.scrollY; render(); window.scrollTo(0, y); } else render(); }));

(async function start() {
  const draft = store.get(); if (draft && typeof draft === "object") A = Object.assign({ items: {} }, draft);
  lang = (A.lang === "en" || A.lang === "fr") ? A.lang : ((navigator.language || "").startsWith("fr") ? "fr" : "en");
  render();
  if (!/^[0-9a-f]{32}$/.test(token)) { status = "closed"; }
  else {
    try {
      let r;
      try { r = await rpc("scoping_open", { p_token: token, p_device: DEVICE, p_self: SELF }); }
      catch (e) { if (!/http 404/.test(String(e))) throw e; r = await rpc("scoping_open", { p_token: token }); }   // base not yet on 014
      if (SELF) $("#selfnote").classList.remove("hidden");
      if (r && r.ok && !r.submitted && !SELF) {
        try { fetch(`${SB_URL}/functions/v1/scoping-notify`, { method: "POST", keepalive: true, headers: { "apikey": SB_KEY, "Content-Type": "application/json" }, body: JSON.stringify({ token, event: "open" }) }).catch(() => {}); } catch (e) {}
      }
      if (!r || !r.ok) status = "closed";
      else { if (!draft || !draft.lang) lang = r.lang === "en" ? "en" : "fr"; status = r.submitted ? "already" : "open"; }
    } catch (e) { status = "offline"; }
  }
  if (!A.date) { const d = new Date(); A.date = d.toLocaleDateString(lang === "fr" ? "fr-FR" : "en-GB"); }
  $("#loading").classList.add("hidden");
  if (status === "open") { $("#form").classList.remove("hidden"); wire(); }
  else $("#closed").classList.remove("hidden");
  render();
  window.addEventListener("pagehide", () => { if (status === "open") store.set(Object.assign({}, A, { lang })); });
  document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => { if (status === "open") { A.lang = lang; store.set(A); } }));
})();
</script>
</body></html>
