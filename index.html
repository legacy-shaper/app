<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B3924">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">

var L=h&&h.label,F=h&&h.full,x=function(v){return String(v).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});};
window.__homeLabel=L||"";
document.write('<meta name="apple-mobile-web-app-title" content="'+x(L||"Legacy Shaper")+'"><title>'+x(F||"Legacy Shaper")+'</title>'+(L?'':'<link rel="manifest" href="manifest.webmanifest">'));})();</script>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Hanken+Grotesk:wght@300;400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
<style>
:root{
  --deep:#1B3924;--green:#244A30;--ink:#16241A;--gold:#C4A052;--gold-soft:#E9DDBE;--ivory:#F4F0E6;--gold-text:#7A6332;
  --bg:#F4F0E6;--surface:#FBF8F1;--surface-2:#EFE9DC;--line:#E2D9C6;--muted:#6A6656;--faint:#9A9483;
  --serif:"Cormorant Garamond","Cormorant",Garamond,"Times New Roman",serif;
  --sans:"Hanken Grotesk","Helvetica Neue","Avenir Next",Helvetica,Arial,sans-serif;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
img{display:block;max-width:100%}
.lbl{font-size:10.5px;letter-spacing:3px;text-transform:uppercase;color:var(--gold-text);font-weight:500}
.serif{font-family:var(--serif)}

/* ---------- gate ---------- */
#gate{position:fixed;inset:0;z-index:50;background:var(--deep);color:var(--ivory);display:flex;align-items:center;justify-content:center;padding:calc(24px + var(--safe-t)) 24px calc(24px + var(--safe-b));overflow:auto}
#gate .box{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px;text-align:center}
#gate .logo{width:210px;margin:0 auto 6px}
#gate h1{font-family:var(--serif);font-weight:500;font-size:30px;margin:4px 0 0;letter-spacing:.4px}
#gate p{margin:0;font-size:14px;line-height:1.6;color:#DDD5C3}
#gate .rule{width:56px;height:1px;background:var(--gold);margin:6px auto}
#gate input[type=email],#gate input.code{font:inherit;font-size:16px;padding:13px 14px;border-radius:10px;border:1px solid rgba(196,160,82,.55);background:rgba(244,240,230,.06);color:var(--ivory);outline:none;text-align:center;width:100%}
#gate input.code{font-size:24px;letter-spacing:8px;font-family:var(--serif)}
#gate input:focus{border-color:var(--gold)}
#gate .btn{font-size:15px;font-weight:500;padding:13px;border-radius:10px;border:0;background:var(--gold);color:var(--deep)}
#gate .btn[disabled]{opacity:.6}
#gate .ghost{background:transparent;color:var(--gold);border:1px solid rgba(196,160,82,.5);padding:11px;border-radius:10px;font-size:14px}
#gate .link{background:none;border:0;color:#CDBF9D;font-size:13px;text-decoration:underline;text-underline-offset:3px}
#gate .msg{min-height:20px;font-size:13px;color:#E9C9A0}
#gate label.chk{display:flex;gap:10px;align-items:flex-start;text-align:left;font-size:13px;color:#DDD5C3;cursor:pointer}
#gate label.chk input{margin-top:3px;accent-color:var(--gold)}
#gate .langs{display:flex;gap:14px;justify-content:center;margin-top:8px}
#gate .langs button{background:none;border:0;color:#B9AF95;font-size:12px;letter-spacing:2px}
#gate .langs button.on{color:var(--gold)}
#gate .foot{font-size:11.5px;color:#9FB0A3;margin-top:10px}

/* ---------- app shell ---------- */
#app{min-height:100vh}
.top{position:sticky;top:0;z-index:20;background:var(--deep);color:var(--ivory);padding:calc(12px + var(--safe-t)) 18px 0}
.top .row{display:flex;align-items:center;gap:12px;max-width:1180px;margin:0 auto}
.top .logo{height:30px;width:auto}
.top .coll{flex:1;min-width:0;text-align:right}
.top .coll b{display:block;font-family:var(--serif);font-weight:500;font-size:19px;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .coll span{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#C9BD9C}
.top .menu{background:none;border:1px solid rgba(196,160,82,.45);color:var(--gold);border-radius:999px;width:36px;height:36px;display:grid;place-items:center;flex:none}
.tabs{display:flex;gap:4px;max-width:1180px;margin:10px auto 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;color:#CFC6AE;padding:10px 12px 12px;font-size:12px;letter-spacing:2.4px;text-transform:uppercase;border-bottom:1px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--gold);border-bottom-color:var(--gold)}
.status{max-width:1180px;margin:0 auto;padding:10px 18px 0;font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.status i{width:7px;height:7px;border-radius:50%;background:#7FA88A;display:inline-block}
.status.off i{background:var(--gold)}
main{max-width:1180px;margin:0 auto;padding:14px 18px calc(40px + var(--safe-b))}

/* ---------- overview ---------- */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 22px 20px;margin-bottom:16px}
.hero h2{font-family:var(--serif);font-weight:500;font-size:28px;margin:6px 0 2px}
.hero .sub{color:var(--muted);font-size:13.5px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
.kpi{border-top:1px solid var(--gold);padding-top:10px}
.kpi b{display:block;font-family:var(--serif);font-weight:500;font-size:26px;line-height:1.15}
.kpi .cur{display:block;font-family:var(--serif);font-size:19px;line-height:1.3;font-variant-numeric:tabular-nums}
.sect{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 12px}
.sect h3{font-family:var(--serif);font-weight:500;font-size:22px;margin:0}
.sect button{background:none;border:0;color:var(--gold-text);font-size:12px;letter-spacing:2px;text-transform:uppercase}
@media(max-width:620px){.top .coll{display:none}.top .row{justify-content:space-between}.top .logo{height:26px}}
.kpi span{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold-text)}
@media(max-width:700px){.kpis{grid-template-columns:repeat(2,1fr)}}

.tools{display:flex;gap:10px;align-items:center;margin:4px 0 14px;flex-wrap:wrap}
.search{flex:1;min-width:180px;font:inherit;font-size:15px;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);outline:none}
.search:focus{border-color:var(--gold)}
select.sel{font:inherit;font-size:14px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%}

/* ---------- works grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(27,57,36,.10)}
.card .ph{aspect-ratio:1/1;background:var(--surface-2);display:grid;place-items:center;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card .ph{position:relative}
.selmode .card .ph::after{content:"";position:absolute;right:8px;top:8px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.22);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.selmode .card.picked{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.selmode .card.picked .ph::after{content:"✓";background:var(--deep);border-color:var(--gold);color:var(--gold);font:700 13px/20px var(--sans);text-align:center}
button.tb2{font:inherit;font-size:14px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
#selBar{position:fixed;left:12px;right:12px;bottom:calc(14px + var(--safe-b));z-index:26;max-width:720px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--deep);color:var(--ivory);border:1px solid var(--gold);border-radius:14px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#selBar .sn{flex:1 1 160px;font-size:13.5px}
#selBar button{font:inherit;font-size:13.5px;padding:9px 13px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:transparent;color:var(--ivory)}
#selBar button.go{background:var(--gold);border-color:var(--gold);color:var(--deep);font-weight:600}
#selBar button[disabled]{opacity:.45}
body.selecting #chatFab{display:none!important}
body.selecting #main{padding-bottom:110px}
.card .tx{padding:11px 12px 13px}
.card .ar{font-weight:600;font-size:13.5px}
.card .ti{font-family:var(--serif);font-style:italic;font-size:16px;line-height:1.3}
.card .lo{font-size:11.5px;color:var(--muted);margin-top:4px}
.empty{color:var(--muted);padding:40px 10px;text-align:center;font-family:var(--serif);font-size:19px}

/* ---------- lists ---------- */
.block{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:16px;overflow:hidden}
.block h3{font-family:var(--serif);font-weight:500;font-size:21px;margin:0;padding:16px 18px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.block h3 small{font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:400}
.line{display:flex;gap:12px;align-items:center;padding:11px 18px;border-top:1px solid var(--line);text-align:left;width:100%;background:none;border-left:0;border-right:0;border-bottom:0}
.line .th{width:46px;height:46px;border-radius:8px;object-fit:cover;flex:none;background:var(--surface-2)}
.line .mid{flex:1;min-width:0}
.line .mid b{font-weight:500}
.line .mid div{font-size:12.5px;color:var(--muted)}
.line .amt{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;font-size:14px}
.line .amt div{font-size:11.5px;color:var(--muted)}
.tot{display:flex;justify-content:space-between;padding:12px 18px;border-top:1px solid var(--gold);font-weight:500;gap:10px;flex-wrap:wrap}
.chipline{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px}
.chip.on{background:var(--deep);border-color:var(--deep);color:var(--ivory)}

/* ---------- detail ---------- */
#detail{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch}
.dtop{position:sticky;top:0;z-index:2;background:rgba(244,240,230,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;gap:10px;padding:calc(10px + var(--safe-t)) 14px 10px;border-bottom:1px solid var(--line)}
.dtop button{background:none;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px}
.dtop .sp{flex:1}
.dwrap{max-width:1100px;margin:0 auto;padding:18px 18px calc(50px + var(--safe-b));display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:30px}
@media(max-width:820px){.dwrap{grid-template-columns:1fr;gap:18px}}
.stage{background:var(--surface-2);border-radius:14px;min-height:280px;display:grid;place-items:center;overflow:hidden;position:relative}
.stage img{max-height:72vh;width:auto;margin:0 auto;object-fit:contain}
.thumbs{display:flex;gap:8px;margin-top:10px;overflow-x:auto}
.thumbs button{border:1px solid var(--line);padding:0;border-radius:8px;overflow:hidden;width:62px;height:62px;flex:none;background:var(--surface-2)}
.thumbs button.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs button.sct{width:84px;position:relative}
.thumbs button.sct span{position:absolute;left:3px;right:3px;bottom:3px;background:rgba(27,57,36,.82);color:#F4F0E6;font-size:9px;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 0;text-align:center}
.scbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.scbar[hidden]{display:none}
.scbar .sw{display:flex;gap:8px}
.scbar .sw button{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);padding:0}
.scbar .sw button.on{border-color:var(--gold);box-shadow:0 0 0 2px rgba(196,160,82,.35)}
.scbar .tb{border:1px solid var(--gold);background:none;color:var(--gold-text);border-radius:10px;padding:8px 12px;font-size:13px}
.scbar .seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px}
.scbar .seg button{border:0;background:none;border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--muted)}
.scbar .seg button.on{background:var(--deep);color:var(--ivory)}
.scbar label{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.scbar label input{width:16px;height:16px;accent-color:var(--gold)}
.dh .artist{font-weight:600;font-size:19px}
.dh .title{font-family:var(--serif);font-size:30px;line-height:1.15;margin:2px 0 8px}
.dh .title i{font-style:italic}
.facts{margin:14px 0 0;border-top:1px solid var(--gold)}
.fact{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.fact dt{font-size:10.5px;letter-spacing:2.4px;text-transform:uppercase;color:var(--gold-text);padding-top:3px}
.fact dd{margin:0;white-space:pre-line}
@media(max-width:520px){.fact{grid-template-columns:1fr;gap:2px}}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.acts button{border:1px solid var(--deep);background:var(--deep);color:var(--ivory);border-radius:10px;padding:10px 14px;font-size:13.5px}
.acts button.alt{background:transparent;color:var(--deep)}
.sec{margin-top:22px}
.crpkg{font-size:10.5px;letter-spacing:2.4px;text-transform:uppercase;color:var(--gold-text);padding:14px 0 4px}
.crdocs{margin-top:6px}
.sec h4{font-family:var(--serif);font-weight:500;font-size:20px;margin:0 0 6px}
.doc{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--surface);width:100%;text-align:left}
.doc span{font-size:12px;color:var(--muted)}

/* ---------- sheet ---------- */
#sheet{position:fixed;inset:0;z-index:40;background:rgba(10,20,13,.45);display:flex;justify-content:flex-end}
#sheet .pane{width:min(380px,100%);height:100%;background:var(--surface);padding:calc(20px + var(--safe-t)) 20px calc(20px + var(--safe-b));overflow:auto;display:flex;flex-direction:column;gap:12px}
#sheet .pane h3{font-family:var(--serif);font-weight:500;font-size:24px;margin:0}
#sheet .opt{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 14px;text-align:left;font-size:14px}
#sheet .opt small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
#sheet .who{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translateX(-50%);background:var(--deep);color:var(--ivory);padding:11px 16px;border-radius:10px;font-size:13.5px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:90vw;text-align:center}
.install{background:var(--surface);border:1px solid var(--gold);border-radius:14px;padding:14px 16px;margin-bottom:16px;font-size:13.5px;display:flex;gap:12px;align-items:flex-start}
.install b{font-family:var(--serif);font-size:18px;font-weight:500;display:block}
.install button{background:none;border:0;color:var(--muted);font-size:20px;line-height:1;padding:0 4px}

/* ---------- view at scale (shared: tools/room.css) ---------- */
#room{position:fixed;inset:0;z-index:36;background:#1B1D1B;display:flex;flex-direction:column;color:var(--ivory,#F4F0E6)}
#room .rtop{display:flex;align-items:center;gap:10px;padding:calc(10px + var(--safe-t,env(safe-area-inset-top,0px))) 14px 10px;background:var(--deep,#1B3924)}
#room .rtop button{background:none;border:1px solid rgba(196,160,82,.5);color:var(--gold,#C4A052);border-radius:999px;padding:8px 14px;font-size:13px;flex:none}
#room .rtop .rt{flex:1;min-width:0;text-align:center;line-height:1.25}
#room .rtop .rt b{display:block;font-family:var(--serif);font-weight:500;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#room .rtop .rt span{font-size:11px;letter-spacing:1.6px;color:#C9BD9C}
#room .rstage{flex:1;position:relative;overflow:hidden;touch-action:none;background:#DAD8D3}
#room canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#room canvas.drag{cursor:grabbing}
#room .hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(22,36,26,.72);color:var(--ivory,#F4F0E6);font-size:12.5px;padding:7px 13px;border-radius:999px;pointer-events:none;transition:opacity .6s;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
#room .rbar{display:flex;align-items:center;gap:10px;padding:10px 14px calc(10px + var(--safe-b,env(safe-area-inset-bottom,0px)));background:var(--deep,#1B3924);flex-wrap:wrap}
#room .sw{display:flex;gap:8px;align-items:center}
#room .sw button{width:26px;height:26px;border-radius:50%;border:2px solid rgba(244,240,230,.25);padding:0}
#room .sw button.on{border-color:var(--gold,#C4A052);box-shadow:0 0 0 2px rgba(196,160,82,.35)}
#room .rbar .rb{margin-left:auto;display:flex;gap:8px}
#room .rbar .tb{background:none;border:1px solid rgba(196,160,82,.5);color:var(--gold,#C4A052);border-radius:10px;padding:8px 12px;font-size:13px}
#room .rbar .dim{font-size:12px;color:#C9BD9C;letter-spacing:.5px}
#room .rbar .tb.pri{background:var(--gold,#C4A052);color:var(--deep,#1B3924);border-color:var(--gold,#C4A052);font-weight:600}
#room[hidden]{display:none}


/* ---------- assistant ---------- */
#chatFab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(18px + var(--safe-b));z-index:25;display:flex;align-items:center;gap:8px;background:var(--deep);color:var(--gold);border:1px solid rgba(196,160,82,.55);border-radius:999px;padding:11px 16px 11px 13px;font-size:13.5px;box-shadow:0 10px 28px rgba(27,57,36,.28)}
#chatFab svg{flex:none}
#chatFab .n{background:var(--gold);color:var(--deep);border-radius:999px;min-width:19px;height:19px;font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 5px}
#chat{position:fixed;inset:0;z-index:38;background:rgba(10,20,13,.45);display:flex;justify-content:flex-end}
#chat .cp{width:min(440px,100%);height:100%;background:var(--bg);display:flex;flex-direction:column}
#chat .ch{background:var(--deep);color:var(--ivory);padding:calc(14px + var(--safe-t)) 16px 14px;display:flex;align-items:center;gap:12px}
#chat .ch .who{flex:1;min-width:0}
#chat .ch b{display:block;font-family:var(--serif);font-weight:500;font-size:20px;letter-spacing:.3px}
#chat .ch span{font-size:12px;color:#C9BD9C;display:flex;align-items:center;gap:6px}
#chat .ch span i{width:7px;height:7px;border-radius:50%;background:#7FA88A;display:inline-block}
#chat .ch button{background:none;border:1px solid rgba(196,160,82,.5);color:var(--gold);border-radius:999px;width:34px;height:34px;display:grid;place-items:center;flex:none}
#chat .cl{flex:1;overflow:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
#chat .intro{font-size:13px;color:var(--muted);text-align:center;padding:8px 18px 4px;line-height:1.55}
#chat .m{max-width:84%;padding:10px 13px;border-radius:14px;font-size:14.5px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
#chat .m small{display:block;font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold-text);margin-bottom:3px}
#chat .m.me{align-self:flex-end;background:var(--deep);color:var(--ivory);border-bottom-right-radius:4px}
#chat .m.me small{color:#C9BD9C}
#chat .m.them{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
#chat .m.dylan{border-color:var(--gold)}
#chat .m .at{display:block;margin-top:6px;font-size:12.5px;text-decoration:underline;text-underline-offset:3px;color:inherit;background:none;border:0;padding:0;text-align:left}
#chat .m img.ai{border-radius:8px;margin-top:6px;max-height:180px;width:auto}
#chat .m .about{display:block;font-size:12px;opacity:.75;margin-top:4px;font-style:italic}
#chat .t{font-size:10.5px;color:var(--faint);margin-top:-6px}
#chat .t.me{align-self:flex-end}
#chat .sys{align-self:center;font-size:12px;color:var(--gold-text);font-style:italic;text-align:center;padding:2px 10px}
#chat .typing{align-self:flex-start;display:flex;gap:4px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
#chat .typing i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:blink 1.2s infinite}
#chat .typing i:nth-child(2){animation-delay:.2s}#chat .typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
#chat .cf{border-top:1px solid var(--line);background:var(--surface);padding:10px 12px calc(10px + var(--safe-b))}
#chat .ctx{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin:0 2px 8px}
#chat .ctx b{font-weight:500;color:var(--ink);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chat .ctx button{background:none;border:0;color:var(--muted);font-size:16px;padding:0 4px}
#chat .row{display:flex;gap:8px;align-items:flex-end}
#chat textarea{flex:1;font:inherit;font-size:16px;line-height:1.4;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);resize:none;max-height:140px;outline:none}
#chat textarea:focus{border-color:var(--gold)}
#chat .row button{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--bg);color:var(--deep)}
#chat .row button.send{background:var(--deep);border-color:var(--deep);color:var(--gold)}
#chat .row button[disabled]{opacity:.45}
#chat .note{font-size:12px;color:var(--gold-text);min-height:0;margin:6px 2px 0}

/* ---------- print: inventory sheet ---------- */
#print{display:none}
/* sheet layout lives outside @media print so the page can measure it before printing (#print stays hidden on screen) */
#print{color:#16241A;font-family:var(--sans);font-size:10.5pt}
#print .pl{width:44mm;margin:0 auto 4mm}
#print .pimg{max-height:100mm;max-width:100%;margin:0 auto 5mm;object-fit:contain}
#print .pa{font-weight:600;font-size:13pt}
#print .pt{font-family:var(--serif);font-size:17pt;margin:1mm 0 3mm}
#print .pt i{font-style:italic}
#print table{width:100%;border-collapse:collapse;margin-top:3mm;border-top:.6pt solid #C4A052}
#print td{padding:1.5mm 0;border-bottom:.4pt solid #E2D9C6;vertical-align:top}
#print td:first-child{width:44mm;font-size:7.5pt;letter-spacing:1.6pt;text-transform:uppercase;color:#7A6332}
#print .pf{margin-top:4mm;font-size:7.5pt;color:#6A6656;text-align:center}
#print .pscale img{width:100%;max-height:220mm;object-fit:contain}
#print .pscale div{margin-top:4mm;font-size:8pt;color:#6A6656}
#print.pmeasure{display:block;position:absolute;left:-10000px;top:0;width:178mm;visibility:hidden}
@media print{
  @page{size:A4;margin:16mm 16mm 14mm}
  html,body{background:#fff!important}
  body>*:not(#print){display:none!important}
  #print{display:block}
  #print .pscale{break-before:page;page-break-before:always;text-align:center;padding-top:10mm}
  #print .psheet+.psheet{break-before:page;page-break-before:always}
}
</style>

let LANG=(()=>{ try{ const s=localStorage.getItem("ls-lang"); if(s) return s; }catch(e){} return /^fr/i.test(navigator.language||"")?"fr":"en"; })();
const t=k=>(I18N[LANG]&&I18N[LANG][k]!==undefined)?I18N[LANG][k]:(I18N.en[k]!==undefined?I18N.en[k]:k);
const setLang=l=>{ LANG=l; document.documentElement.lang=l; try{ localStorage.setItem("ls-lang",l); }catch(e){} };
document.documentElement.lang=LANG;

/* ---------------- helpers ---------------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtMoney=(v,cur)=>{ if(v==null||v===""||isNaN(+v)) return ""; try{ return new Intl.NumberFormat(LANG==="fr"?"fr-FR":"en-GB",{style:"currency",currency:cur||"USD",maximumFractionDigits:0}).format(+v); }catch(e){ return (+v).toLocaleString()+" "+(cur||""); } };
const fmtDate=d=>{ if(!d) return ""; const x=new Date(String(d).slice(0,10)+"T12:00:00"); if(isNaN(x)) return String(d); return x.toLocaleDateString(LANG==="fr"?"fr-FR":"en-GB",{day:"numeric",month:"long",year:"numeric"}); };
const fmtStamp=ms=>new Date(ms).toLocaleString(LANG==="fr"?"fr-FR":"en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
const inches=dim=>{ const nums=String(dim||"").replace(/,/g,".").match(/\d+(\.\d+)?/g); if(!nums||!/cm/i.test(dim||"")) return ""; return nums.map(n=>(Math.round(+n/2.54*10)/10).toLocaleString(LANG==="fr"?"fr-FR":"en-GB",{maximumFractionDigits:1})).join(" × ")+" in"; };
const dimsLine=d=>{ if(!d) return ""; const i=inches(d); return i?`${d}\n${i}`:d; };
const editionLine=a=>{ const ty=(a.edition_type||"").toLowerCase(); if(ty==="unique") return t("unique"); if(ty==="ap") return t("ap")+(a.edition_number?` · ${a.edition_number}`:""); if(ty==="edition") return a.edition_number||""; return a.edition_number||""; };
const sumByCur=(rows,val,cur)=>{ const m={}; rows.forEach(r=>{ const v=+r[val]; if(!isFinite(v)||r[val]==null||r[val]==="") return; const c=r[cur]||"USD"; m[c]=(m[c]||0)+v; }); return m; };
const curStack=m=>{ const k=Object.keys(m).sort((a,b)=>m[b]-m[a]); return k.length?k.map(c=>`<span class="cur">${esc(fmtMoney(m[c],c))}</span>`).join(""):`<b>—</b>`; };
const curLine=m=>Object.keys(m).sort().map(c=>fmtMoney(m[c],c)).join(" · ")||"—";
function toast(msg,ms){ const d=document.createElement("div"); d.className="toast"; d.textContent=msg; document.body.appendChild(d); setTimeout(()=>d.remove(),ms||2600); }
function haptic(){ try{ navigator.vibrate&&navigator.vibrate(8); }catch(e){} }

/* ---------------- device storage (IndexedDB) ---------------- */
const SHARED=()=>{ try{ return sessionStorage.getItem("ls-shared")==="1"; }catch(e){ return false; } };
const idb=(()=>{ let p; const open=()=>p||(p=new Promise((res,rej)=>{ const r=indexedDB.open("ls-client",1); r.onupgradeneeded=()=>r.result.createObjectStore("kv"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }));
  const op=async(mode,fn)=>{ const db=await open(); return new Promise((res,rej)=>{ const tx=db.transaction("kv",mode); const q=fn(tx.objectStore("kv")); tx.oncomplete=()=>res(q&&q.result); tx.onerror=()=>rej(tx.error); }); };
  return { get:k=>op("readonly",s=>s.get(k)).catch(()=>undefined), set:(k,v)=>SHARED()?Promise.resolve():op("readwrite",s=>s.put(v,k)).catch(()=>{}), clear:()=>op("readwrite",s=>s.clear()).catch(()=>{}) };
})();
const authStore={ getItem:k=>{ try{ return (SHARED()?sessionStorage:localStorage).getItem(k); }catch(e){ return null; } },
  setItem:(k,v)=>{ try{ (SHARED()?sessionStorage:localStorage).setItem(k,v); }catch(e){} },
  removeItem:k=>{ try{ localStorage.removeItem(k); sessionStorage.removeItem(k); }catch(e){} } };

function gateEmail(prefill,msg){
  gate._redraw=()=>gateEmail(($("#gEmail")||{}).value||prefill,msg);
  gateShell(`<div class="rule"></div><h1>${esc(t("access"))}</h1><p>${esc(t("intro"))}</p>

      <button class="btn" type="submit">${esc(t("getCode"))}</button></form>`);

    try{ sessionStorage.setItem("ls-shared",$("#gShared").checked?"1":"0"); }catch(x){}

    const r=await sendCode(email); if(r.ok) gateCode(email); else { b.disabled=false; b.textContent=t("getCode"); $("#gMsg").textContent=t(r.msg); } };
}
async function sendCode(email){
  try{ const {error}=await sb.auth.signInWithOtp({email, options:{shouldCreateUser:false}});
    if(!error) return {ok:true};
    if(/rate|seconds|too many/i.test(error.message||"")||error.status===429) return {ok:false,msg:"wait"};
    if(/fetch|network/i.test(error.message||"")) return {ok:false,msg:"neterr"};
    return {ok:false,msg:"unknown"};
  }catch(e){ return {ok:false,msg:"neterr"}; }
}
function gateCode(email,msg){
  gate._redraw=()=>gateCode(email,msg);
  gateShell(`<div class="rule"></div><h1>${esc(t("codeTitle"))}</h1><p>${esc(t("codeIntro"))}<br><b style="color:#F4F0E6">${esc(email)}</b></p>
    <form id="gForm" style="display:flex;flex-direction:column;gap:12px;margin-top:6px">
      <input class="code" id="gCode" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="········" required>
      <div class="msg" id="gMsg">${esc(msg||"")}</div>
      <button class="btn" type="submit">${esc(t("verify"))}</button>
      <button class="ghost" type="button" id="gResend">${esc(t("resend"))}</button>
      <button class="link" type="button" id="gOther">${esc(t("other"))}</button></form>`);
  const inp=$("#gCode"); inp.focus();
  inp.oninput=()=>{ inp.value=inp.value.replace(/\D/g,"").slice(0,8); if(inp.value.length===8) $("#gForm").requestSubmit(); };
  $("#gOther").onclick=()=>gateEmail(email);
  $("#gResend").onclick=async()=>{ const r=await sendCode(email); $("#gMsg").textContent=r.ok?t("codeSent"):t(r.msg); };
  $("#gForm").onsubmit=async e=>{ e.preventDefault(); const b=e.target.querySelector(".btn"); if(b.disabled) return; b.disabled=true; b.textContent=t("verifying");
    try{ const {error}=await sb.auth.verifyOtp({email, token:inp.value, type:"email"});
      if(error){ b.disabled=false; b.textContent=t("verify"); $("#gMsg").textContent=/fetch|network/i.test(error.message||"")?t("neterr"):t("badCode"); inp.select(); return; }
      haptic(); afterSignIn();
    }catch(x){ b.disabled=false; b.textContent=t("verify"); $("#gMsg").textContent=t("neterr"); } };
}
function gateMfa(factorId,msg){
  gate._redraw=()=>gateMfa(factorId,msg);
  gateShell(`<div class="rule"></div><h1>${esc(t("mfaTitle"))}</h1><p>${esc(t("mfaIntro"))}</p>
    <form id="gForm" style="display:flex;flex-direction:column;gap:12px;margin-top:6px"><input class="code" id="gCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="······" required>
    <div class="msg" id="gMsg">${esc(msg||"")}</div><button class="btn" type="submit">${esc(t("verify"))}</button><button class="link" type="button" id="gOut">${esc(t("other"))}</button></form>`);
  const inp=$("#gCode"); inp.focus(); inp.oninput=()=>{ inp.value=inp.value.replace(/\D/g,"").slice(0,6); };
  $("#gOut").onclick=()=>signOut();
  $("#gForm").onsubmit=async e=>{ e.preventDefault(); const {error}=await sb.auth.mfa.challengeAndVerify({factorId, code:inp.value});
    if(error){ $("#gMsg").textContent=t("badCode"); return; } afterSignIn(); };
}
function gateOffline(hasCopy){
  gate._redraw=()=>gateOffline(hasCopy);

/* ---------------- sign-in flow ---------------- */
async function afterSignIn(){
  try{
    const {data:{user}}=await sb.auth.getUser(); if(!user){ gateEmail(); return; }
    S.user={id:user.id,email:user.email};
    const {data:aal}=await sb.auth.mfa.getAuthenticatorAssuranceLevel();
    if(aal && aal.nextLevel==="aal2" && aal.currentLevel!=="aal2"){
      const {data:f}=await sb.auth.mfa.listFactors(); const totp=(f&&f.totp||[]).find(x=>x.status==="verified");
      if(totp){ gateMfa(totp.id); return; }
    }
    try{ localStorage.setItem("ls-last-user",user.id); }catch(e){}
    await loadCollections();
  }catch(e){ console.error(e); const c=await lastCopy(); if(c) openFromCache(); else gateOffline(false); }
}
async function loadCollections(){
  const {data:prof}=await sb.from("profiles").select("role").eq("id",S.user.id).maybeSingle();
  S.isAdmin=!!(prof&&prof.role==="admin");
  const {data,error}=await sb.from("collections").select("id,slug,name,subtitle,display_currency,cover_artwork_id").order("name");
  if(error) throw error;
  S.collections=data||[];
  await idb.set("colls:"+S.user.id,S.collections);
  let want=null; try{ want=localStorage.getItem("ls-coll:"+S.user.id); }catch(e){}
  const pick=S.collections.find(c=>c.id===want)||(S.collections.length===1?S.collections[0]:null);
  if(pick) await openCollection(pick.id); else if(S.collections.length) showPicker(); else { gate.hidden=false; gateShell(`<div class="rule"></div><h1>${esc(t("access"))}</h1><p>${esc(t("unknown"))}</p><button class="ghost" id="gOut">${esc(t("signOut"))}</button>`); $("#gOut").onclick=signOut; }
}
function showPicker(){
  gate._redraw=showPicker;
  gateShell(`<div class="rule"></div><h1>${esc(t("pick"))}</h1>${S.collections.map(c=>`<button class="ghost" data-c="${esc(c.id)}">${esc(c.name)}</button>`).join("")}
    <button class="link" id="gOut">${esc(t("signOut"))}</button>`);
  gate.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>openCollection(b.dataset.c));
  $("#gOut").onclick=signOut;
}

const ART_COLS="id,collection_id,ref,artist,title,year,medium,dimensions,category,edition_type,edition_number,owner_name,ownership_share,ownership_note,co_owners,ownership_visible,location_text,location_since,provenance,exhibitions,literature,condition,insured_value,insured_currency,acquisition_date,acquisition_price,acquisition_currency,acquisition_source,notes,thumb,updated_at";
const EXP_COLS="id,supplier,label,category,date,amount,currency,artwork_id,collection_id,status,notes";
const DOC_COLS="id,kind,name,mime,size,storage_path,artwork_id,expense_id,created_at";
async function fetchCollection(cid){
  const q=async p=>{ const {data,error}=await p; if(error) throw error; return data||[]; };
  const [coll]=await q(sb.from("collections").select("id,slug,name,subtitle,display_currency,cover_artwork_id").eq("id",cid));
  // scale_view: the at-scale composition set by Legacy Shaper (SQL 005), crating: packing shared with the collector (SQL 006); older databases still load
  const wq=cols=>q(sb.from("artworks").select(cols).eq("collection_id",cid).order("artist"));
  const works=await wq(ART_COLS+",scale_view,crating,dimensions_framed").catch(()=>wq(ART_COLS+",scale_view,crating")).catch(()=>wq(ART_COLS+",scale_view")).catch(()=>wq(ART_COLS));
  const ids=works.map(w=>w.id);
  let views=[]; for(let i=0;i<ids.length;i+=80) views=views.concat(await q(sb.from("artwork_views").select("id,artwork_id,sort,created_at").in("artwork_id",ids.slice(i,i+80))));
  const expenses=await q(sb.from("expenses").select(EXP_COLS).eq("collection_id",cid).eq("visible_to_client",true).order("date",{ascending:false}));
  const docs=await q(sb.from("documents").select(DOC_COLS).eq("collection_id",cid).eq("visible_to_client",true).order("created_at",{ascending:false}));
  return { coll:coll||S.collections.find(c=>c.id===cid)||{id:cid,name:""}, works, views, expenses, docs };
}
async function openCollection(cid){
  S.cid=cid; try{ localStorage.setItem("ls-coll:"+S.user.id,cid); }catch(e){}
  const cached=await idb.get(`snap:${S.user.id}:${cid}`);
  if(cached){ S.data=cached.data; S.stamp=cached.at; S.online=false; showApp(); }
  try{ const data=await fetchCollection(cid); S.data=data; S.stamp=Date.now(); S.online=true;
    await idb.set(`snap:${S.user.id}:${cid}`,{at:S.stamp,data}); showApp(); prefetchPhotos(); chatProbe();
  }catch(e){ console.warn(e); if(!cached){ gateOffline(false); return; } S.online=false; renderStatus(); }
}
async function refresh(silent){
  if(!S.cid||!S.user||navigator.onLine===false) return;
  try{ const data=await fetchCollection(S.cid); const changed=JSON.stringify(data)!==JSON.stringify(S.data);
    S.data=data; S.stamp=Date.now(); S.online=true; await idb.set(`snap:${S.user.id}:${S.cid}`,{at:S.stamp,data});
    if(changed){ render(); if(S.openId) openWork(S.openId,true); prefetchPhotos(); } else renderStatus();
    if(!silent) toast(t("live"));
    chatProbe();
  }catch(e){ S.online=false; renderStatus(); }
}
async function viewPhoto(vid){

/* The home-screen / Dock name follows the open collection: the icon carries the Legacy Shaper logo,

function homeLabel(name){
  const s=String(name||"").trim().replace(/^(the|la|le|les)\s+/i,"").replace(/^l[’']/i,"")
    .replace(/^collection\s+/i,"").replace(/\s+collection$/i,"").trim();
  return s||"Legacy Shaper";
}
let _brandFor="";
function brandCollection(coll){
  const name=(coll&&coll.name)||""; if(name===_brandFor) return; _brandFor=name;
  const label=homeLabel(name), full=name?`Legacy Shaper · ${name}`:"Legacy Shaper";
  document.title=full;
  const meta=document.querySelector('meta[name="apple-mobile-web-app-title"]'); if(meta) meta.setAttribute("content",label);
  if(SHARED()) return;  // shared computer: nothing kept on the device
  let saved=false;
  try{ localStorage.setItem("ls-home",JSON.stringify({label,full})); saved=JSON.parse(localStorage.getItem("ls-home")).label===label; }catch(e){}
  // In the browser (not yet installed), reload once so the page is parsed with the collection's name.
  const standalone=window.navigator.standalone===true||matchMedia("(display-mode: standalone)").matches;
  let once=false; try{ once=sessionStorage.getItem("ls-home-reload")===label; }catch(e){}
  if(saved&&!standalone&&window.__homeLabel!==label&&!once&&S.online!==false){
    try{ sessionStorage.setItem("ls-home-reload",label); }catch(e){}
    setTimeout(()=>location.reload(),50);
  }
}

/* dragging */
function roomPt(e){ const r=document.getElementById("rCv").getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
const inRect=(p,r,pad)=>p.x>=r.x-pad&&p.x<=r.x+r.w+pad&&p.y>=r.y-pad&&p.y<=r.y+r.h+pad;
function roomDown(e){
  const p=roomPt(e), c=chairRect(), a=R.stand?standHit():artHit();
  const what=(!R.noChair&&inRect(p,c,4))?"chair":inRect(p,a,8)?"art":null; if(!what) return;
  R.drag={what,p0:p,ax:R.artX,ay:R.artY,chx:R.chairX}; e.target.setPointerCapture(e.pointerId); e.target.classList.add("drag");
  const h=document.getElementById("rHint"); if(h) h.style.opacity="0";

function roomMove(e){
  if(!R.drag) return; const p=roomPt(e), dx=p.x-R.drag.p0.x, dy=p.y-R.drag.p0.y; const {h,w}=artBox(R);
  const halfW=R.W/2/R.scale;
  if(R.drag.what==="art"&&R.stand){ const g=standGeom(R), lim=R.W/2*g.zc/R.f; R.artX=Math.max(-lim,Math.min(lim,R.drag.ax+dx*g.zc/R.f)); }
  else if(R.drag.what==="art"){
    R.artX=Math.max(-halfW-w/2+w*0.2, Math.min(halfW+w/2-w*0.2, R.drag.ax+dx/R.scale));   // keep at least a fifth of the work in view
    const top=(R.baseY)/R.scale;                                   // visible wall height (cm)
    R.artY=Math.max(h/2+2, Math.min(top-h/2*0.2, R.drag.ay-dy/R.scale));

}
function roomUp(e){ if(!R.drag) return; R.drag=null; try{ e.target.releasePointerCapture(e.pointerId); }catch(x){} e.target.classList.remove("drag"); }
async function roomSave(){
